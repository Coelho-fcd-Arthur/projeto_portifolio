<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio</title>
  <!-- Avisa o CSS que o JavaScript está ativo (usado nas animações de entrada) -->
  <script>document.documentElement.classList.add("js");</script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Karla:wght@400;500&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Os textos são preenchidos pelo script.js com os dados do arquivo dados.js -->

  <!-- CABEÇALHO: título à esquerda, opções à direita -->
  <nav class="navbar navbar-expand-md fixed-top barra">
    <div class="container">
      <a class="navbar-brand marca" href="#sobre" id="marca"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#sobre">Sobre mim</a></li>
          <li class="nav-item"><a class="nav-link" href="#artes">Minhas artes</a></li>
          <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">

    <!-- BANNER: foto + sobre mim -->
    <section id="sobre" class="banner">
      <div class="banner-foto">
        <span>Minha foto</span>
        <img id="foto-perfil" alt="Foto do autor" onerror="this.style.display='none'">
      </div>
      <div class="banner-texto">
        <h2>Sobre mim</h2>
        <div id="sobre-textos"></div>
      </div>
    </section>

    <!-- INTRODUÇÃO + CARROSSEL DE CARDS -->
    <section id="artes" class="bloco revelar">
      <h2>Minhas artes</h2>
      <p id="intro-artes"></p>

      <div class="carrossel">
        <button class="seta seta-ant" id="seta-ant" aria-label="Ver desenhos anteriores">&#8592;</button>
        <div class="trilho" id="trilho"></div>
        <button class="seta seta-prox" id="seta-prox" aria-label="Ver próximos desenhos">&#8594;</button>
      </div>
    </section>

    <!-- CONTATOS -->
    <section id="contato" class="bloco revelar">
      <div class="caixa-contato">
        <div>
          <h2>Contato</h2>
          <p id="contato-texto"></p>
          <ul class="redes" id="redes"></ul>
        </div>
        <form id="form-contato" novalidate>
          <input type="checkbox" id="botcheck" class="d-none" tabindex="-1" autocomplete="off">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" required minlength="3">
            <div class="invalid-feedback">Digite seu nome (mínimo 3 letras).</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required>
            <div class="invalid-feedback">Digite um e-mail válido, como nome@email.com.</div>
          </div>
          <div class="mb-3">
            <label for="mensagem" class="form-label">Mensagem</label>
            <textarea class="form-control" id="mensagem" rows="3" required minlength="10"></textarea>
            <div class="invalid-feedback">Escreva pelo menos 10 caracteres.</div>
          </div>
          <button type="submit" class="btn btn-destaque">Enviar mensagem</button>
          <div id="retorno" class="mt-3" role="status"></div>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="rodape">
    <small>&copy; <span id="ano"></span> <span id="rodape-nome"></span>. Todos os desenhos são de minha autoria.</small>
  </footer>

  <!-- JANELINHA (modal do Bootstrap) com a foto e a descrição do desenho -->
  <div class="modal fade" id="modal-desenho" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <button type="button" class="btn-close modal-fechar" data-bs-dismiss="modal" aria-label="Fechar"></button>
        <div class="modal-body modal-grade">
          <img id="modal-img" alt="">
          <div>
            <h3 id="modal-titulo"></h3>
            <p id="modal-descricao"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dados.js"></script>  <!-- primeiro o conteúdo... -->
  <script src="script.js"></script> <!-- ...depois o código que usa o conteúdo -->
</body>
</html>
